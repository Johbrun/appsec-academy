# Étude descriptive — données embarquées du lab.
#
# Reprend l'IDÉE de BSIMM : ne pas dire ce qu'il faudrait faire, mais décrire ce
# que font réellement les organisations observées, activité par activité, avec
# la proportion de celles qui la pratiquent. Les identifiants reprennent la
# nomenclature BSIMM (domaine, niveau, rang) ; les intitulés sont réécrits en
# français et les fréquences sont celles de ce lab, pas celles d'un rapport.
#
# Ce fichier existe pour opposer deux lectures : un modèle prescriptif dit
# « niveau 3 » ; une étude descriptive dit « 9 organisations sur 10 le font
# déjà, et vous non ». La seconde déplace plus de budget que la première.
#
# Seuil retenu par le challenge : une activité est dite TRÈS RÉPANDUE quand sa
# fréquence est supérieure ou égale à 60 %.

