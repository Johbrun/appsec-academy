id: credential-stuffing
_note: 'La règle fournie. Elle ne bougera pas : c’est au journal de parler sa langue.'
window: 10m
where:
  - field: event.action
    op: eq
    value: authn_login_fail
  - field: event.outcome
    op: eq
    value: failure
  - field: http.request.method
    op: eq
    value: POST
group_by:
  - source.ip
having:
  - metric: count
    op: gte
    value: 12
  - metric: distinct
    field: user.name
    op: gte
    value: 8
