id: password-spray
name: Pulvérisage de mot de passe
description: Un échec par compte, sur un grand nombre de comptes distincts, depuis une même source.
severity: high
risk_score: 68
tags:
  - 'Domaine: Identité'
  - 'Tactique: Credential Access'
  - 'Technique: T1110.003'
  - 'Domaine: Identité'
interval: 10m
from: now-45m
note: |-
  ## Triage

  1. Compter les comptes distincts touchés par la source.
  2. Chercher une connexion réussie dans la même fenêtre.
query:
  window: 30m
  where:
    - field: event.action
      op: eq
      value: authn_login_fail
  group_by:
    - source.ip
  having:
    - metric: distinct
      field: user.name
      op: gte
      value: 50
