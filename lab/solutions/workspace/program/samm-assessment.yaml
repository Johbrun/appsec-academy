# Livrable de référence — challenge samm-assessment (M1).
#
# L'auto-évaluation de Novafact sur les 30 flux du modèle embarqué. Les réponses
# sont UN profil plausible d'équipe produit qui livre vite et n'a jamais
# structuré de programme : elle teste, elle construit proprement, elle ne
# gouverne rien et ne vérifie pas sa conception. La sincérité des réponses
# n'est pas vérifiable et n'est pas notée — ce qui l'est, c'est que les 90
# activités soient renseignées, que la monotonie soit respectée (un niveau ne se
# saute pas) et que tous les scores se retrouvent par le calcul.

evaluation:
