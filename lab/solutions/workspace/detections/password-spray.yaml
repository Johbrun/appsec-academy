# Pulvérisage de mot de passe — corrigé de référence.
#
# Le pulvérisage est conçu pour passer sous les seuils par compte : un échec
# par compte ne déclenche rien, nulle part. Il faut changer d'axe et compter
# les comptes distincts par source, pas les échecs par compte.
#
# Compter les échecs ne marcherait pas : le test de charge en produit trois
# cents sur un seul compte, davantage que plusieurs pulvérisages.
id: password-spray
window: 30m
where:
  - { field: event.action, op: eq, value: authn_login_fail }
group_by: [source.ip]
having:
  - { metric: distinct, field: user.name, op: gte, value: 50 }
