# L'atomique qui valide la règle — corrigé de référence.
#
# Une règle écrite d'après une hypothèse n'est pas une règle validée. L'atomique
# prouve le cycle complet : avant détonation la règle est muette, après elle
# lève, et après retour arrière l'environnement est exactement celui du départ.
#
# Le retour arrière est la partie qu'on oublie, et c'est elle qui rend le test
# rejouable en continu : sans lui, la deuxième exécution part d'un état sale et
# ne prouve plus rien.
id: credential-stuffing
rule: credential-stuffing

# Quatorze comptes cibles, avec leurs vrais mots de passe.
setup:
  - action: create_account
    email: "cible-{{i}}@novafact.example"
    password: "Legitime-{{i}}!aZ"
    repeat: 14

# Le bourrage : le même mot de passe faible essayé sur les quatorze comptes,
# depuis une seule adresse, en un peu plus de deux minutes.
detonation:
  - action: login
    email: "cible-{{i}}@novafact.example"
    password: "Printemps2024!"
    source_ip: 198.51.100.77
    advance: 10s
    repeat: 14

# Retour arrière : les quatorze comptes disparaissent, l'environnement revient
# à son état initial.
rollback:
  - action: delete_account
    email: "cible-{{i}}@novafact.example"
    repeat: 14
