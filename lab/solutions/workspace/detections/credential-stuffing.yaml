# Bourrage d'identifiants — corrigé de référence.
#
# Trois décisions, et chacune écarte une famille de leurres :
#
#   le filtre sur l'échec      écarte la passerelle SSO, dont presque tout réussit
#   la fenêtre                 écarte ce qui s'étale sur trois heures
#   le nombre de comptes       écarte le test de charge et l'application mobile,
#                              qui martèlent un seul compte
#   le nombre d'échecs         écarte la suite d'intégration et l'utilisateur maladroit
#
# La syntaxe est celle du lab, pas celle d'Elastic : voir fixtures/m18/README.md.
id: credential-stuffing
window: 10m
where:
  - { field: event.action, op: eq, value: authn_login_fail }
group_by: [source.ip]
having:
  - { metric: count, op: gte, value: 20 }
  - { metric: distinct, field: user.name, op: gte, value: 10 }
