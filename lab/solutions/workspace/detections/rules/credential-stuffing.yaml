id: credential-stuffing
name: Bourrage d’identifiants depuis une source unique
description: Nombreux échecs d’authentification sur des comptes distincts depuis une même adresse source.
severity: high
risk_score: 73
tags:
  - 'Domaine: Identité'
  - 'Tactique: Credential Access'
  - 'Technique: T1110.004'
interval: 5m
from: now-15m
note: |-
  ## Triage

  1. Confronter la source aux listes de proxys connus.
  2. Vérifier si l’un des comptes visés a été pris.
  3. Forcer la réinitialisation des comptes compromis.
query:
  window: 10m
  where:
    - field: event.action
      op: eq
      value: authn_login_fail
  group_by:
    - source.ip
  having:
    - metric: count
      op: gte
      value: 20
    - metric: distinct
      field: user.name
      op: gte
      value: 10
