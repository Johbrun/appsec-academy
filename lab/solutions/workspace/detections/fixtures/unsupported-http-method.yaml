# Le quasi-jumeau utilise OPTIONS : une méthode que le navigateur envoie tout
# seul pour ses préchecks CORS, et qu'une règle trop large attraperait.
rule: unsupported-http-method

positive:
  - "@timestamp": "2026-03-04T13:30:00.000Z"
    event: { id: fx-mt-1, kind: event, category: [web], type: [denied], action: http_request, outcome: failure }
    user: { name: dev@acme.example }
    source: { ip: 198.51.100.22 }
    url: { path: /api/invoices }
    http: { request: { method: TRACE }, response: { status_code: 405 } }

negative:
