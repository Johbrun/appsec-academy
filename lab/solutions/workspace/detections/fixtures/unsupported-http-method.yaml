    event: { id: fx-mt-2, kind: event, category: [web], type: [denied], action: http_request, outcome: failure }
    user: { name: dev@acme.example }
    source: { ip: 198.51.100.22 }
    url: { path: /api/invoices }
    http: { request: { method: OPTIONS }, response: { status_code: 405 } }
