# Fixtures de `prompt-injection-external`.
#
# Le quasi-jumeau est le cas légitime le plus proche : le même outil, la même
# destination extérieure, mais l'instruction vient de l'utilisateur et non du
# document. C'est toute la détection en un champ.
rule: prompt-injection-external

positive:
  - "@timestamp": "2026-03-04T12:00:00.000Z"
    event: { id: fx-pi-1, kind: event, category: [process], type: [info], action: tool_call, outcome: success }
    user: { name: dev@acme.example }
    source: { ip: 203.0.113.77 }
    destination: { domain: exfil.attacker.example }
    novafact:
      assistant: { tool: send_mail, origin: document, target: external, source_document: INV-1003 }

negative:
  - "@timestamp": "2026-03-04T12:00:20.000Z"
    event: { id: fx-pi-2, kind: event, category: [process], type: [info], action: tool_call, outcome: success }
    user: { name: dev@acme.example }
    source: { ip: 203.0.113.77 }
    destination: { domain: exfil.attacker.example }
    novafact:
      assistant: { tool: send_mail, origin: user, target: external, source_document: INV-1003 }
