# Fixtures de `mass-export`.
#
# Le quasi-jumeau est à une ligne du seuil : 999 lignes exportées. C'est le
# test qui dit si la règle compare bien ce qu'elle croit comparer — et celui
# qui cassera le jour où quelqu'un changera le seuil sans le dire.
rule: mass-export

positive:
  - "@timestamp": "2026-03-04T14:05:00.000Z"
    event: { id: fx-me-1, kind: event, category: [web], type: [access], action: sensitive_read, outcome: success }
    user: { name: compta@globex.example }
    source: { ip: 203.0.113.207 }
    url: { path: /api/invoices }
    http: { request: { method: GET }, response: { status_code: 200 } }
    novafact: { export: { rows: 4200 } }

negative:
  - "@timestamp": "2026-03-04T14:05:40.000Z"
    event: { id: fx-me-2, kind: event, category: [web], type: [access], action: sensitive_read, outcome: success }
    user: { name: compta@globex.example }
    source: { ip: 203.0.113.207 }
    url: { path: /api/invoices }
    http: { request: { method: GET }, response: { status_code: 200 } }
    novafact: { export: { rows: 999 } }
