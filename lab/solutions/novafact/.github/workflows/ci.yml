name: CI

on: [push, pull_request]

# CORRIGÉ : le minimum au niveau du workflow ; un job qui aurait besoin de plus
# le déclare pour lui seul.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # CORRIGÉ : le propriétaire est « actions », pas « action », et la
      # référence est un SHA — une étiquette peut être repointée.
      # CORRIGÉ : sans persist-credentials: false, le jeton reste dans .git/config.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      # CORRIGÉ : npm ci installe exactement le lockfile, ou échoue.
      - name: Install dependencies
        run: npm ci

      # CORRIGÉ : le script est téléchargé, vérifié contre une empreinte
      # versionnée dans le dépôt, puis seulement exécuté.
      - name: Coverage uploader
        run: |
          curl -sSfo uploader.sh https://uploader.novafact-ci.example/upload.sh
          sha256sum -c .github/uploader.sha256
          bash uploader.sh

      - name: Test
        run: npm test

      # CORRIGÉ : on ne téléverse que le résultat du build, jamais la racine.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.3
        with:
          name: build
          path: dist/
