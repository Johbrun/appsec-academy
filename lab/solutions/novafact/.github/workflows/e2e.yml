name: Tests de bout en bout

on:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    # CORRIGÉ : un runner hébergé est jeté après usage. Un runner self-hosted
    # garde ce qu'une PR y laisse, et la suivante le retrouve.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: npm ci && npm run test:e2e
