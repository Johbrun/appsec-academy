name: Vérification des PR

# CORRIGÉ : pull_request s'exécute dans le contexte du fork, sans les secrets
# du dépôt. C'est ce qui rend l'exécution du code de la PR acceptable.
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # CORRIGÉ : plus aucun secret dans le job qui exécute du code non revu.
      - name: Build de la PR
        run: npm ci && npm run build
