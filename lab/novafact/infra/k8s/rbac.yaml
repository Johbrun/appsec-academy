# VULNÉRABLE — fixture du lab, ne pas réutiliser
#
# Droits du compte de service de l'API. Les jokers ont été mis « le temps de
# savoir ce dont l'API a besoin », il y a dix-huit mois. Le jeton du compte est
# monté automatiquement dans tous les pods qui l'utilisent.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: novafact-api
  namespace: novafact
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: novafact-api
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: novafact-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: novafact-api
subjects:
  - kind: ServiceAccount
    name: novafact-api
    namespace: novafact
